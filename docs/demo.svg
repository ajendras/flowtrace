<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="FlowTrace — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="520" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="520" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">FlowTrace — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#111111">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.72s steps(16) 0.60s forwards" fill="#e5e7eb">pip install -e .</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.62s forwards" fill="#94a3b8">Obtaining file://.../flowtrace</text>
<text x="50" y="126" class="l" style="animation:show .01s 1.84s forwards" fill="#4ade80">Successfully installed flowtrace</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.41s forwards"><tspan fill="#111111">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.41s forwards,type 0.68s steps(15) 2.41s forwards" fill="#e5e7eb">flowtrace serve</text>
<text x="50" y="204" class="l" style="animation:show .01s 3.39s forwards" fill="#94a3b8">FlowTrace running on http://localhost:8080</text>
<text x="50" y="230" class="l" style="animation:show .01s 3.61s forwards" fill="#94a3b8">Open browser to view dashboard</text>
<text x="28" y="282" class="l" style="animation:show .01s 4.18s forwards"><tspan fill="#111111">❯</tspan></text><text x="50" y="282" class="l ty" style="animation:show .01s 4.18s forwards,type 1.44s steps(32) 4.18s forwards" fill="#e5e7eb">python examples/agent_example.py</text>
<text x="50" y="308" class="l" style="animation:show .01s 5.92s forwards" fill="#94a3b8">Trace recorded • ID: tr-7f3k9p</text>
<text x="50" y="334" class="l" style="animation:show .01s 6.14s forwards" fill="#94a3b8">2 LLM calls • 3 tool uses • 14.2s total</text>
<text x="28" y="386" class="l" style="animation:show .01s 6.71s forwards"><tspan fill="#111111">❯</tspan></text><text x="50" y="386" class="l ty" style="animation:show .01s 6.71s forwards,type 1.94s steps(43) 6.71s forwards" fill="#e5e7eb">open http://localhost:8080/traces/tr-7f3k9p</text>
<text x="50" y="412" class="l" style="animation:show .01s 8.95s forwards" fill="#94a3b8">Graph shows ResearchAgent → web_search → summarize</text>
<text x="50" y="438" class="l" style="animation:show .01s 9.17s forwards" fill="#94a3b8">Clicked node reveals exact prompt and 87-token response</text>
<g class="l" style="animation:show .01s 9.74s forwards"><text x="28" y="490" fill="#111111">❯</text><rect class="cur" x="50" y="475" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
