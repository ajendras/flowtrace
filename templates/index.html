<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowTrace</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <span class="logo">FlowTrace</span>
                <span class="version">v0.1.0</span>
            </div>
            <div class="header-controls">
                <button onclick="toggleCompareMode()" id="compare-btn" class="btn btn-primary" disabled>
                    Compare
                </button>
                <button onclick="exitComparison()" id="exit-compare-btn" class="btn hidden">
                    Single View
                </button>
                <button onclick="clearAllTraces()" class="btn">Clear All</button>
            </div>
        </header>

        <div class="content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Traces</h2>
                    <input type="text" id="search-input" placeholder="Filter traces..." onkeyup="filterTraces()">
                </div>
                <div id="traces-list" class="trace-list"></div>
            </aside>

            <!-- Main area -->
            <main class="main-area">
                <!-- Single view -->
                <div id="single-view">
                    <div class="view-header">
                        <h1 id="trace-title">Select a trace</h1>
                        <div id="trace-meta" class="meta"></div>
                    </div>
                    <div class="graph-panel">
                        <div id="graph-container" class="svg-container"></div>
                    </div>
                </div>

                <!-- Compare view (hidden by default) -->
                <div id="compare-view" class="hidden">
                    <div class="view-header">
                        <h1>Trace Comparison</h1>
                        <div class="meta compare-meta">
                            <span id="compare-meta-left"></span>
                            <span class="vs">vs</span>
                            <span id="compare-meta-right"></span>
                        </div>
                    </div>
                    
                    <div class="split-container">
                        <!-- Left panel -->
                        <div class="panel">
                            <div class="panel-header" id="left-header">Trace 1</div>
                            <div id="left-graph-container" class="svg-container"></div>
                            <div class="panel-stats" id="left-stats"></div>
                        </div>
                        
                        <!-- Right panel -->
                        <div class="panel">
                            <div class="panel-header" id="right-header">Trace 2</div>
                            <div id="right-graph-container" class="svg-container"></div>
                            <div class="panel-stats" id="right-stats"></div>
                        </div>
                    </div>

                    <!-- Differences panel -->
                    <div class="diff-panel" id="diff-panel">
                        <h3>Differences</h3>
                        <div id="diff-content"></div>
                    </div>
                </div>
            </main>

            <!-- Inspector -->
            <aside class="inspector">
                <div class="inspector-header">
                    <h2>Inspector</h2>
                    <div id="inspector-trace-id" class="trace-id-badge"></div>
                </div>
                <div id="inspector-content">
                    <div class="empty-inspector">
                        Click a node in the graph to inspect
                    </div>
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
