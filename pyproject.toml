[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtrace"
version = "0.1.0"
description = "Visualizes and debugs multi-step LLM agent workflows with interactive graphs and local inspection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "FlowTrace Contributors"}]
keywords = ["llm", "agent", "observability", "tracing", "debugging"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
]

[project.scripts]
flowtrace = "flowtrace.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
langchain = ["langchain-core>=0.1.29"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
flowtrace = ["templates/*", "static/*"]
